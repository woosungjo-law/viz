<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금 체납이 있으면 양수인이 전부 갚아야 할까? — 책임 성립 조건 플로차트</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FFFFFF;--paper-2:#F8FAFC;--ink:#111827;--muted:#6B7280;--soft:#9CA3AF;
  --rule:rgba(17,24,39,.12);--rule-solid:#E5E7EB;--accent:#1A3A6B;--accent-tint:rgba(26,58,107,.08);--line:#6B7280;
  --font-serif:'Noto Serif KR','Batang','바탕',Georgia,serif;
  --font-sans:'Pretendard','Malgun Gothic','맑은 고딕',-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F141C;--paper-2:#161D29;--ink:#E7ECF4;--muted:#9AA6B8;--soft:#7C8799;
  --rule:rgba(231,236,244,.14);--rule-solid:#2A3446;--accent:#8FB1EE;--accent-tint:rgba(143,177,238,.14);--line:#9AA6B8;}}
:root[data-theme="dark"]{--paper:#0F141C;--paper-2:#161D29;--ink:#E7ECF4;--muted:#9AA6B8;--soft:#7C8799;
  --rule:rgba(231,236,244,.14);--rule-solid:#2A3446;--accent:#8FB1EE;--accent-tint:rgba(143,177,238,.14);--line:#9AA6B8}
:root[data-theme="light"]{--paper:#FFFFFF;--paper-2:#F8FAFC;--ink:#111827;--muted:#6B7280;--soft:#9CA3AF;
  --rule:rgba(17,24,39,.12);--rule-solid:#E5E7EB;--accent:#1A3A6B;--accent-tint:rgba(26,58,107,.08);--line:#6B7280}
body{word-break:keep-all;overflow-wrap:break-word;font-family:var(--font-sans);background:var(--paper);color:var(--ink);line-height:1.6;padding:2.5rem 1rem 3rem}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:1.75rem}
header{display:flex;flex-direction:column;gap:.75rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--font-serif);font-weight:500;font-size:clamp(1.5rem,2.4vw + 1rem,2.2rem);line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
.lead{font-family:var(--font-serif);color:var(--muted);max-width:34em;border-left:2px solid var(--rule-solid);padding-left:1rem}
.diagram{overflow-x:auto}
svg{display:block;width:100%;height:auto}
.d{min-width:880px}
.m{display:none;max-width:420px;margin:0 auto}
@media (max-width:760px){.d{display:none}.m{display:block}}
.n{fill:var(--paper-2);stroke:var(--rule-solid);stroke-width:1.2}
.n.hot{fill:var(--accent-tint);stroke:var(--accent)}
.t{font-family:var(--font-sans);font-size:15px;font-weight:600;fill:var(--ink);text-anchor:middle}
.t.hot{fill:var(--accent)}
.s{font-family:var(--font-sans);font-size:13px;fill:var(--muted);text-anchor:middle}
.k{font-family:var(--font-sans);font-size:13px;fill:var(--muted)}
.e{fill:none;stroke:var(--line);stroke-width:1.3}
.e.hot{stroke:var(--accent)}
.br{fill:none;stroke:var(--rule-solid);stroke-width:2}
.dot{fill:var(--ink)}
footer{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:.35rem;border-top:1px solid var(--rule);padding-top:1rem}
footer .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;color:var(--soft);font-size:.75rem}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">사업양수도 · 양수인 책임</p>
    <h1>세금 체납이 있으면 양수인이 전부 갚아야 할까?</h1>
    <p class="lead">법 구조는 조건부다.</p>
  </header>

  <div class="diagram">
    <svg class="d" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fl-title">
      <title id="fl-title">양수인 책임 성립 조건 플로차트</title>
      <defs>
        <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B7280"/></marker>
        <marker id="arh" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1A3A6B"/></marker>
      </defs>

      <path class="br" d="M20 36 V188"/>
      <text class="k" x="30" y="116">국세기본법 제41조</text>
      <path class="br" d="M20 228 V372"/>
      <text class="k" x="30" y="300">시행령 제22조</text>
      <path class="br" d="M20 428 V492"/>
      <text class="k" x="30" y="464">국세기본법 제41조</text>

      <rect class="n" x="180" y="32" width="640" height="60" rx="30"/>
      <text class="t" x="500" y="68">양도일 이전에 납세의무가 확정된 해당 사업의 국세와 강제징수비</text>
      <path class="e" d="M500 92 V132" marker-end="url(#ar)"/>

      <rect class="n" x="300" y="132" width="400" height="52" rx="6"/>
      <text class="t" x="500" y="164">양도인 재산으로 부족할 때</text>
      <path class="e" d="M500 184 V224" marker-end="url(#ar)"/>

      <rect class="n" x="250" y="224" width="500" height="52" rx="6"/>
      <text class="t" x="500" y="256">사업장 단위로 권리·의무를 포괄승계</text>

      <path class="e" d="M500 276 V300 H290 V316" marker-end="url(#ar)"/>
      <path class="e" d="M500 300 H730 V316" marker-end="url(#ar)"/>

      <rect class="n" x="100" y="316" width="380" height="56" rx="6"/>
      <text class="t" x="290" y="349">양도인과 특수관계(가족 등 밀접한 관계)</text>
      <rect class="n" x="540" y="316" width="380" height="56" rx="6"/>
      <text class="t" x="730" y="349">세금 회피 목적이 있는 경우</text>
      <text class="k" x="510" y="349" style="text-anchor:middle">이거나</text>

      <path class="e" d="M290 372 V396 H500"/>
      <path class="e" d="M730 372 V396 H500"/>
      <circle class="dot" cx="500" cy="396" r="4"/>
      <path class="e hot" d="M500 396 V424" marker-end="url(#arh)"/>

      <rect class="n hot" x="180" y="424" width="640" height="72" rx="6"/>
      <text class="s" x="500" y="452">대통령령이 정한 요건 아래에서</text>
      <text class="t hot" x="500" y="478">사업양수인이 양수받은 재산가액 한도까지 책임을 질 수 있다</text>

      <path class="br" d="M180 520 V556"/>
      <text class="k" x="192" y="543">지방세기본법 제48조는 지방세에 대해 별도의 요건을 둔다.</text>

      <text class="t" x="500" y="604">즉 모든 인수가 위험한 것이 아니라,</text>
      <text class="t hot" x="500" y="630">포괄승계 구조 + 특수관계 또는 회피 목적이라는 조건이 겹쳐야 한다.</text>
    </svg>

    <!-- 좁은 화면용 세로형 (동일 노드·동일 원문) -->
    <svg class="m" viewBox="0 0 360 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flm-title">
      <title id="flm-title">양수인 책임 성립 조건 플로차트(세로형)</title>
      <defs>
        <marker id="arm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B7280"/></marker>
        <marker id="armh" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1A3A6B"/></marker>
      </defs>

      <rect class="n" x="20" y="16" width="320" height="92" rx="28"/>
      <text class="s" x="180" y="40">국세기본법 제41조</text>
      <text class="t" x="180" y="64">양도일 이전에 납세의무가 확정된</text>
      <text class="t" x="180" y="86">해당 사업의 국세와 강제징수비</text>
      <path class="e" d="M180 108 V132" marker-end="url(#arm)"/>

      <rect class="n" x="20" y="132" width="320" height="52" rx="6"/>
      <text class="t" x="180" y="164">양도인 재산으로 부족할 때</text>
      <path class="e" d="M180 184 V208" marker-end="url(#arm)"/>

      <rect class="n" x="20" y="208" width="320" height="76" rx="6"/>
      <text class="s" x="180" y="232">시행령 제22조</text>
      <text class="t" x="180" y="260">사업장 단위로 권리·의무를 포괄승계</text>
      <path class="e" d="M180 284 V308" marker-end="url(#arm)"/>

      <rect class="n" x="20" y="308" width="320" height="52" rx="6"/>
      <text class="t" x="180" y="340" style="font-size:14px">양도인과 특수관계(가족 등 밀접한 관계)</text>
      <text class="k" x="180" y="386" style="text-anchor:middle">이거나</text>
      <rect class="n" x="20" y="400" width="320" height="52" rx="6"/>
      <text class="t" x="180" y="432">세금 회피 목적이 있는 경우</text>
      <path class="e hot" d="M180 452 V484" marker-end="url(#armh)"/>

      <rect class="n hot" x="20" y="484" width="320" height="108" rx="6"/>
      <text class="s" x="180" y="508">국세기본법 제41조</text>
      <text class="s" x="180" y="530">대통령령이 정한 요건 아래에서</text>
      <text class="t hot" x="180" y="556">사업양수인이 양수받은 재산가액 한도까지</text>
      <text class="t hot" x="180" y="578">책임을 질 수 있다</text>

      <path class="br" d="M12 612 V652"/>
      <text class="k" x="24" y="630">지방세기본법 제48조는 지방세에 대해</text>
      <text class="k" x="24" y="650">별도의 요건을 둔다.</text>

      <text class="t" x="180" y="696">즉 모든 인수가 위험한 것이 아니라,</text>
      <text class="t hot" x="180" y="720" style="font-size:14px">포괄승계 구조 + 특수관계 또는 회피 목적이라는</text>
      <text class="t hot" x="180" y="742" style="font-size:14px">조건이 겹쳐야 한다.</text>
    </svg>
  </div>

  <footer>
    <span>법률 근거: 국세기본법 제41조(2026-08-11 시행)·시행령 제22조(2026-07-01 시행), 지방세기본법 제48조(2026-02-05 시행)</span>
    <span>일반적 법률정보이며 개별 사안은 별도 검토가 필요합니다.</span>
    <div class="row"><span>원문: 세금 체납이 있으면 양수인이 전부 갚아야 할까?</span><span>조우성 변호사</span></div>
  </footer>
</main>
</body>
</html>
