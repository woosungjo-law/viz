<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금 체납이 있으면 양수인이 전부 갚아야 할까? — 인수 전 확인 체크리스트</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FFFFFF;--paper-2:#F8FAFC;--ink:#111827;--muted:#6B7280;--soft:#9CA3AF;
  --rule:rgba(17,24,39,.12);--rule-solid:#E5E7EB;--accent:#1A3A6B;--accent-tint:rgba(26,58,107,.08);
  --font-serif:'Noto Serif KR','Batang','바탕',Georgia,serif;
  --font-sans:'Pretendard','Malgun Gothic','맑은 고딕',-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F141C;--paper-2:#161D29;--ink:#E7ECF4;--muted:#9AA6B8;--soft:#7C8799;
  --rule:rgba(231,236,244,.14);--rule-solid:#2A3446;--accent:#8FB1EE;--accent-tint:rgba(143,177,238,.14);}}
:root[data-theme="dark"]{--paper:#0F141C;--paper-2:#161D29;--ink:#E7ECF4;--muted:#9AA6B8;--soft:#7C8799;
  --rule:rgba(231,236,244,.14);--rule-solid:#2A3446;--accent:#8FB1EE;--accent-tint:rgba(143,177,238,.14)}
:root[data-theme="light"]{--paper:#FFFFFF;--paper-2:#F8FAFC;--ink:#111827;--muted:#6B7280;--soft:#9CA3AF;
  --rule:rgba(17,24,39,.12);--rule-solid:#E5E7EB;--accent:#1A3A6B;--accent-tint:rgba(26,58,107,.08)}
body{word-break:keep-all;overflow-wrap:break-word;font-family:var(--font-sans);background:var(--paper);color:var(--ink);line-height:1.6;padding:2.5rem 1rem 3rem}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:1.75rem}
header{display:flex;flex-direction:column;gap:.75rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--font-serif);font-weight:500;font-size:clamp(1.5rem,2.4vw + 1rem,2.2rem);line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
.lead{font-family:var(--font-serif);color:var(--muted);border-left:2px solid var(--rule-solid);padding-left:1rem;max-width:34em}
.bar{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.count{font-weight:700;font-size:1.05rem}
.track{flex:1;min-width:120px;height:6px;border-radius:3px;background:var(--rule-solid);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.reset{font:inherit;font-size:.85rem;padding:.35rem .8rem;border:1px solid var(--rule-solid);border-radius:999px;background:var(--paper-2);color:var(--ink);cursor:pointer}
.reset:hover{border-color:var(--accent)}
ul{list-style:none;display:flex;flex-direction:column;gap:.6rem}
li label{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 1rem;border:1px solid var(--rule-solid);border-radius:8px;background:var(--paper-2);cursor:pointer;line-height:1.55}
li label:hover{border-color:var(--accent)}
li input{margin-top:.3rem;width:1.1rem;height:1.1rem;accent-color:var(--accent);flex-shrink:0}
li input:checked + span{color:var(--ink)}
li:has(input:checked) label{background:var(--accent-tint);border-color:var(--accent)}
input:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.close{border-top:1px solid var(--rule-solid);padding-top:1.25rem;font-family:var(--font-serif);font-size:1.05rem}
footer{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:.35rem;border-top:1px solid var(--rule);padding-top:1rem}
footer .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;color:var(--soft);font-size:.75rem}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">사업양수도 · 실무 체크포인트</p>
    <h1>세금 체납이 있으면 양수인이 전부 갚아야 할까?</h1>
    <p class="lead">납세증명서 한 장으로 모든 위험이 닫히지 않는다.</p>
  </header>

  <div class="bar" aria-live="polite">
    <span class="count" id="count">확인한 항목 0/8</span>
    <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
    <button type="button" class="reset" id="reset">모두 해제</button>
  </div>

  <ul id="list">
    <li><label><input type="checkbox"><span>증명서의 발급일과 다루는 세목도 계약일과 함께 기록해 둔다</span></label></li>
    <li><label><input type="checkbox"><span>국세·지방세 완납증명과 함께 신고·경정·압류 자료를 조회해 기준일별로 보관하는 것</span></label></li>
    <li><label><input type="checkbox"><span>이미 확정된 체납, 신고 전이지만 발생한 거래, 세무조사와 수정신고 가능성, 국세와 지방세·공과금을 기준일별로 갈라 놓아야 한다</span></label></li>
    <li><label><input type="checkbox"><span>양도일 직전 신고분의 납부기한, 예정된 세무조사나 수정신고, 지방세와 국세의 기준일을 별도 달력에 표시한다</span></label></li>
    <li><label><input type="checkbox"><span>양도인은 신고서·납부서·압류 통지·세무대리인 연락처를 제출하고, 양수인은 무엇을 확인했는지 서명으로 남겨야 한다</span></label></li>
    <li><label><input type="checkbox"><span>포괄승계 범위에 대한 사실자료(사업장·종업원·고객·자산의 실제 이전)를 거래 당시부터 확보해 두어야 요건 다툼에서 방어가 된다</span></label></li>
    <li><label><input type="checkbox"><span>예상 리스크 금액만큼 잔금에서 유보하고, 추후 과세관청 조사에 양도인이 자료를 내주도록 협조 의무 조항을 묶어 두는 것</span></label></li>
    <li><label><input type="checkbox"><span>확인되지 않은 세액은 잔금 유보나 보증으로 처리할 항목과 단순 확인 대기 항목을 나누어 적는다</span></label></li>
  </ul>

  <p class="close">“계약서에 적었으니 안전하다”는 생각부터 버리라고 권한다.</p>

  <footer>
    <span>법률 근거: 국세기본법 제41조(2026-08-11 시행)·시행령 제22조(2026-07-01 시행), 지방세기본법 제48조(2026-02-05 시행)</span>
    <span>일반적 법률정보이며 개별 사안은 별도 검토가 필요합니다.</span>
    <div class="row"><span>원문: 세금 체납이 있으면 양수인이 전부 갚아야 할까?</span><span>조우성 변호사</span></div>
  </footer>
</main>
<script>
(function(){
  var boxes=Array.prototype.slice.call(document.querySelectorAll('#list input')),
      count=document.getElementById('count'),fill=document.getElementById('fill'),reset=document.getElementById('reset');
  function render(){
    var n=boxes.filter(function(b){return b.checked}).length;
    count.textContent='확인한 항목 '+n+'/'+boxes.length;
    fill.style.width=(n/boxes.length*100)+'%';
  }
  boxes.forEach(function(b){b.addEventListener('change',render)});
  reset.addEventListener('click',function(){boxes.forEach(function(b){b.checked=false});render();});
  render();
})();
</script>
</body>
</html>
