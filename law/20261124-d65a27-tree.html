<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>우리 아이, 법으로는 어떻게 보호받을까 — 도해</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #ffffff;
      --paper-2: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --soft: #9ca3af;
      --rule: rgba(17, 24, 39, .12);
      --rule-solid: #e5e7eb;
      --accent: #1a3a6b;
      --accent-tint: rgba(26, 58, 107, .08);
      --link: #2e6be6;
      --serif: 'Noto Serif KR', 'Batang', '바탕', Georgia, serif;
      --sans: Pretendard, 'Malgun Gothic', '맑은 고딕', -apple-system, 'Segoe UI', sans-serif;
      --mono: D2Coding, Consolas, 'Courier New', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111827;
        --paper-2: #172033;
        --ink: #f9fafb;
        --muted: #cbd5e1;
        --soft: #94a3b8;
        --rule: rgba(248, 250, 252, .15);
        --rule-solid: rgba(203, 213, 225, .25);
        --accent: #9bb7df;
        --accent-tint: rgba(155, 183, 223, .13);
        --link: #9bb7df;
      }
    }
    [data-theme="light"] {
      color-scheme: light;
      --paper: #ffffff; --paper-2: #f8fafc; --ink: #111827; --muted: #6b7280; --soft: #9ca3af;
      --rule: rgba(17, 24, 39, .12); --rule-solid: #e5e7eb; --accent: #1a3a6b;
      --accent-tint: rgba(26, 58, 107, .08); --link: #2e6be6;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --paper: #111827; --paper-2: #172033; --ink: #f9fafb; --muted: #cbd5e1; --soft: #94a3b8;
      --rule: rgba(248, 250, 252, .15); --rule-solid: rgba(203, 213, 225, .25); --accent: #9bb7df;
      --accent-tint: rgba(155, 183, 223, .13); --link: #9bb7df;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .page { width: min(100% - 40px, 880px); margin-inline: auto; }
    header { padding: 48px 0 28px; }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font: 700 12px/1.4 var(--sans);
      letter-spacing: .08em;
    }
    h1 {
      margin: 0;
      font: 500 clamp(28px, 5vw, 48px)/1.2 var(--serif);
      letter-spacing: -.04em;
      text-wrap: balance;
    }
    .casefile {
      margin: 0 0 36px;
      padding: 20px 24px;
      border: 1px solid var(--rule-solid);
      border-left: 4px solid var(--accent);
      background: var(--paper-2);
    }
    .casefile-label { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .casefile p:last-child { margin: 0; font: 500 clamp(15px, 2vw, 18px)/1.65 var(--serif); }
    figure { margin: 0; }
    figcaption { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    svg { display: block; width: 100%; height: auto; }
    svg .t  { font: 600 12px var(--sans); fill: var(--ink); }
    svg .tl { font: 400 12px var(--sans); fill: var(--ink); }
    svg .tag { font: 500 11px var(--mono); fill: var(--muted); }
    svg .root { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    svg .root-t { font: 600 13px var(--sans); fill: var(--ink); }
    svg .head { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
    svg .leaf { fill: var(--paper-2); stroke: var(--muted); stroke-width: .8; }
    svg .ln { fill: none; stroke: var(--muted); stroke-width: 1; }
    svg.m .t, svg.m .tl, svg.m .root-t { font-size: 13px; }
    svg.m { display: none; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 36px;
      padding: 18px 0 28px;
      border-top: 1px solid var(--rule-solid);
      color: var(--muted);
      font-size: 12px;
    }
    footer .src { display: grid; gap: 4px; }
    footer .by { flex: 0 0 auto; color: var(--ink); font-weight: 650; }
    @media (max-width: 760px) {
      .page { width: min(100% - 32px, 560px); }
      header { padding: 32px 0 22px; }
      .casefile { padding: 16px; }
      svg.d { display: none; }
      svg.m { display: block; }
      footer { flex-direction: column; gap: 6px; }
    }
    @media print {
      :root { color-scheme: light; --paper: #fff; --paper-2: #f8fafc; --ink: #111827; --muted: #4b5563; --accent: #1a3a6b; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">가족상속법 · 도해</p>
      <h1>우리 아이, 법으로는 어떻게 보호받을까</h1>
    </header>

    <section class="casefile" aria-labelledby="case-title">
      <p class="casefile-label" id="case-title">사례</p>
      <p>초등학생 아들이 부모 몰래 게임 아이템을 200만 원어치 결제한 사실을 알게 됐는데, 게임사는 이미 사용한 아이템은 환불이 불가능하다고 합니다. 이혼 후 홀로 아이를 키우는 경우 전 배우자가 양육비를 2년째 보내지 않을 뿐 아니라 친권 행사에도 자꾸 간섭해 갈등이 깊어지고 있습니다.</p>
    </section>

    <figure>
      <figcaption>부모의 개입 범위를 가르는 네 갈래</figcaption>

      <svg class="d" viewBox="0 0 760 400" role="img" aria-label="부모의 개입 범위를 가르는 네 갈래: 동의 여부, 친권의 범위와 행사, 학대·방임, 부모 사망">
        <!-- connectors -->
        <path class="ln" d="M380 52V80M98 80H662M98 80V104M286 80V104M474 80V104M662 80V104"/>
        <path class="ln" d="M18 176V332M18 232H30M18 332H30"/>
        <path class="ln" d="M206 176V352M206 224H218M206 292H218M206 352H218"/>
        <path class="ln" d="M394 176V308M394 224H406M394 308H406"/>
        <path class="ln" d="M582 176V232M582 232H594"/>
        <!-- root -->
        <rect class="root n" x="210" y="8" width="340" height="44" rx="6"/>
        <text class="root-t" x="380" y="34" text-anchor="middle">부모는 법적으로 어디까지 개입할 수 있을까요?</text>
        <!-- heads -->
        <rect class="head n" x="10" y="104" width="176" height="72" rx="6"/>
        <text class="t" x="98" y="136" text-anchor="middle">그 계약에 법정대리인의</text>
        <text class="t" x="98" y="152" text-anchor="middle">동의가 있었느냐</text>
        <rect class="head n" x="198" y="104" width="176" height="72" rx="6"/>
        <text class="t" x="286" y="128" text-anchor="middle">친권의 정확한 범위와</text>
        <text class="t" x="286" y="144" text-anchor="middle">행사 방법을 누가</text>
        <text class="t" x="286" y="160" text-anchor="middle">갖고 있느냐</text>
        <rect class="head n" x="386" y="104" width="176" height="72" rx="6"/>
        <text class="t" x="474" y="136" text-anchor="middle">학대·방임이</text>
        <text class="t" x="474" y="152" text-anchor="middle">의심된다면</text>
        <rect class="head n" x="574" y="104" width="176" height="72" rx="6"/>
        <text class="t" x="662" y="136" text-anchor="middle">부모가 모두</text>
        <text class="t" x="662" y="152" text-anchor="middle">사망한 경우</text>
        <!-- column 1 leaves -->
        <rect class="leaf n" x="30" y="192" width="156" height="80" rx="6"/>
        <text class="tl" x="40" y="212">동의 없이 한</text>
        <text class="tl" x="40" y="228">법률행위는 취소할</text>
        <text class="tl" x="40" y="244">수 있습니다.</text>
        <text class="tag" x="40" y="260">민법 제5조</text>
        <rect class="leaf n" x="30" y="284" width="156" height="96" rx="6"/>
        <text class="tl" x="40" y="304">편의점에서 간식을</text>
        <text class="tl" x="40" y="320">사는 등 일상생활에</text>
        <text class="tl" x="40" y="336">필요한 행위는</text>
        <text class="tl" x="40" y="352">단독으로 할 수</text>
        <text class="tl" x="40" y="368">있습니다.</text>
        <!-- column 2 leaves -->
        <rect class="leaf n" x="218" y="192" width="156" height="64" rx="6"/>
        <text class="tl" x="228" y="212">친권은 부부가</text>
        <text class="tl" x="228" y="228">공동으로 행사합니다</text>
        <text class="tag" x="228" y="244">민법 제909조 제2항</text>
        <rect class="leaf n" x="218" y="268" width="156" height="48" rx="6"/>
        <text class="tl" x="228" y="288">이혼 시 가정법원이</text>
        <text class="tl" x="228" y="304">친권자를 지정합니다.</text>
        <rect class="leaf n" x="218" y="328" width="156" height="48" rx="6"/>
        <text class="tl" x="228" y="348">친권과 양육권은</text>
        <text class="tl" x="228" y="364">별개 개념입니다.</text>
        <!-- column 3 leaves -->
        <rect class="leaf n" x="406" y="192" width="156" height="64" rx="6"/>
        <text class="tl" x="416" y="212">가정법원에 친권상실을</text>
        <text class="tl" x="416" y="228">청구할 수 있습니다.</text>
        <text class="tag" x="416" y="244">민법 제924조</text>
        <rect class="leaf n" x="406" y="268" width="156" height="80" rx="6"/>
        <text class="tl" x="416" y="288">친권이 상실되면</text>
        <text class="tl" x="416" y="304">법원이 후견인을</text>
        <text class="tl" x="416" y="320">선임해 자녀를</text>
        <text class="tl" x="416" y="336">보호합니다.</text>
        <!-- column 4 leaf -->
        <rect class="leaf n" x="594" y="192" width="156" height="80" rx="6"/>
        <text class="tl" x="604" y="212">후견인이 선임되어</text>
        <text class="tl" x="604" y="228">미성년 자녀의</text>
        <text class="tl" x="604" y="244">재산과 인격을</text>
        <text class="tl" x="604" y="260">보호합니다.</text>
      </svg>

      <svg class="m" viewBox="0 0 320 908" role="img" aria-label="부모의 개입 범위를 가르는 네 갈래: 동의 여부, 친권의 범위와 행사, 학대·방임, 부모 사망">
        <!-- connectors -->
        <path class="ln" d="M16 64V814M16 108H28M16 352H28M16 610H28M16 814H28"/>
        <path class="ln" d="M40 136V270M40 186H52M40 270H52"/>
        <path class="ln" d="M40 380V558M40 430H52M40 504H52M40 558H52"/>
        <path class="ln" d="M40 628V752M40 678H52M40 752H52"/>
        <path class="ln" d="M40 832V872M40 872H52"/>
        <!-- root -->
        <rect class="root n" x="8" y="8" width="304" height="56" rx="6"/>
        <text class="root-t" x="160" y="31" text-anchor="middle">부모는 법적으로 어디까지</text>
        <text class="root-t" x="160" y="51" text-anchor="middle">개입할 수 있을까요?</text>
        <!-- branch 1 -->
        <rect class="head n" x="28" y="80" width="284" height="56" rx="6"/>
        <text class="t" x="40" y="103">그 계약에 법정대리인의</text>
        <text class="t" x="40" y="123">동의가 있었느냐</text>
        <rect class="leaf n" x="52" y="148" width="260" height="76" rx="6"/>
        <text class="tl" x="64" y="171">동의 없이 한 법률행위는</text>
        <text class="tl" x="64" y="191">취소할 수 있습니다.</text>
        <text class="tag" x="64" y="211">민법 제5조</text>
        <rect class="leaf n" x="52" y="232" width="260" height="76" rx="6"/>
        <text class="tl" x="64" y="255">편의점에서 간식을 사는 등</text>
        <text class="tl" x="64" y="275">일상생활에 필요한 행위는</text>
        <text class="tl" x="64" y="295">단독으로 할 수 있습니다.</text>
        <!-- branch 2 -->
        <rect class="head n" x="28" y="324" width="284" height="56" rx="6"/>
        <text class="t" x="40" y="347">친권의 정확한 범위와 행사 방법을</text>
        <text class="t" x="40" y="367">누가 갖고 있느냐</text>
        <rect class="leaf n" x="52" y="392" width="260" height="76" rx="6"/>
        <text class="tl" x="64" y="415">친권은 부부가 공동으로</text>
        <text class="tl" x="64" y="435">행사합니다</text>
        <text class="tag" x="64" y="455">민법 제909조 제2항</text>
        <rect class="leaf n" x="52" y="476" width="260" height="56" rx="6"/>
        <text class="tl" x="64" y="499">이혼 시 가정법원이</text>
        <text class="tl" x="64" y="519">친권자를 지정합니다.</text>
        <rect class="leaf n" x="52" y="540" width="260" height="36" rx="6"/>
        <text class="tl" x="64" y="563">친권과 양육권은 별개 개념입니다.</text>
        <!-- branch 3 -->
        <rect class="head n" x="28" y="592" width="284" height="36" rx="6"/>
        <text class="t" x="40" y="615">학대·방임이 의심된다면</text>
        <rect class="leaf n" x="52" y="640" width="260" height="76" rx="6"/>
        <text class="tl" x="64" y="663">가정법원에 친권상실을</text>
        <text class="tl" x="64" y="683">청구할 수 있습니다.</text>
        <text class="tag" x="64" y="703">민법 제924조</text>
        <rect class="leaf n" x="52" y="724" width="260" height="56" rx="6"/>
        <text class="tl" x="64" y="747">친권이 상실되면 법원이 후견인을</text>
        <text class="tl" x="64" y="767">선임해 자녀를 보호합니다.</text>
        <!-- branch 4 -->
        <rect class="head n" x="28" y="796" width="284" height="36" rx="6"/>
        <text class="t" x="40" y="819">부모가 모두 사망한 경우</text>
        <rect class="leaf n" x="52" y="844" width="260" height="56" rx="6"/>
        <text class="tl" x="64" y="867">후견인이 선임되어 미성년 자녀의</text>
        <text class="tl" x="64" y="887">재산과 인격을 보호합니다.</text>
      </svg>
    </figure>

    <footer>
      <div class="src">
        <span>원문: 우리 아이, 법으로는 어떻게 보호받을까</span>
        <span>조문 기준: 민법 2026. 3. 17. 시행</span>
      </div>
      <span class="by">조우성 변호사</span>
    </footer>
  </main>
</body>
</html>
