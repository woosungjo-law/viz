<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불운의 전염성 — 그라시안이 경계한 사람</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FAF8F4;--paper-2:#FFF9F5;--ink:#2C2416;--muted:#7A6A55;--soft:#9B8B76;
  --rule:rgba(44,36,22,.12);--rule-solid:#E8E2D8;--accent:#C4704A;--accent-tint:rgba(196,112,74,.10);
  --font-serif:'Noto Serif KR','Batang','바탕',Georgia,serif;
  --font-sans:'Pretendard','Malgun Gothic','맑은 고딕',-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1E1A14;--paper-2:#27221A;--ink:#F1E9DC;--muted:#BFAE96;--soft:#9B8B76;
  --rule:rgba(241,233,220,.14);--rule-solid:#3A332A;--accent:#E08A62;--accent-tint:rgba(224,138,98,.14);}}
:root[data-theme="dark"]{--paper:#1E1A14;--paper-2:#27221A;--ink:#F1E9DC;--muted:#BFAE96;--soft:#9B8B76;
  --rule:rgba(241,233,220,.14);--rule-solid:#3A332A;--accent:#E08A62;--accent-tint:rgba(224,138,98,.14)}
:root[data-theme="light"]{--paper:#FAF8F4;--paper-2:#FFF9F5;--ink:#2C2416;--muted:#7A6A55;--soft:#9B8B76;
  --rule:rgba(44,36,22,.12);--rule-solid:#E8E2D8;--accent:#C4704A;--accent-tint:rgba(196,112,74,.10)}
body{word-break:keep-all;overflow-wrap:break-word;font-family:var(--font-sans);background:var(--paper);color:var(--ink);line-height:1.6;padding:2.5rem 1rem 3rem}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:2rem}
header{display:flex;flex-direction:column;gap:.9rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--muted)}
h1{font-family:var(--font-serif);font-weight:500;font-size:clamp(1.8rem,3vw + 1rem,2.7rem);line-height:1.25;letter-spacing:-.02em}
.quote{font-family:var(--font-serif);font-size:1.12rem;color:var(--muted);max-width:34em;text-wrap:balance;border-left:2px solid var(--accent);padding-left:1rem}
.intro{font-family:var(--font-serif);font-size:1.15rem;text-wrap:balance;max-width:34em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.panel{background:var(--paper-2);border:1px solid var(--rule-solid);border-radius:8px;padding:1.5rem 1.4rem;display:flex;flex-direction:column;gap:.9rem}
.panel.hot{border-color:var(--accent);background:var(--accent-tint)}
.tag{font-size:.78rem;letter-spacing:.14em;color:var(--muted)}
.hot .tag{color:var(--accent)}
.q{font-family:var(--font-serif);font-size:1.15rem;line-height:1.6;letter-spacing:-.01em;text-wrap:balance}
.core{border-top:1px solid var(--rule-solid);padding-top:1.5rem}
.core p{font-family:var(--font-serif);font-size:clamp(1.25rem,1.6vw + .9rem,1.65rem);line-height:1.5;color:var(--accent);text-wrap:balance}
footer{font-size:.75rem;color:var(--soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;border-top:1px solid var(--rule);padding-top:1rem}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">발타자르 그라시안</p>
    <h1>불운의 전염성</h1>
    <p class="quote">“항상 우울하고 불평만 하는 사람을 멀리하라. 불운은 전염병보다 빠르게 퍼진다”</p>
  </header>

  <p class="intro">언뜻 들으면 약자를 배척하는 매정한 처세술처럼 보이기도 합니다. 하지만 그라시안이 경계한 사람은</p>

  <section class="pair" aria-label="경계한 사람">
    <div class="panel">
      <span class="tag">일시적</span>
      <p class="q">일시적인 시련으로 넘어진 이가 아닙니다.</p>
    </div>
    <div class="panel hot">
      <span class="tag">만성적</span>
      <p class="q">매사를 부정의 렌즈로 바라보며 주변의 생명력을 빨아먹는 사람, 자신의 불행을 무기 삼아 타인의 발목을 잡는 만성적 패배주의자를 뜻합니다.</p>
    </div>
  </section>

  <section class="core" aria-label="핵심">
    <p>핵심은 운명의 기복이 아니라 반응의 습관입니다.</p>
  </section>

  <footer>
    <span>원문: [발타자르 그라시안] 불운의 전염성</span>
    <span>조우성 변호사</span>
  </footer>
</main>
</body>
</html>
